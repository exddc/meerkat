<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meerkat icon sheet</title>
  <style>
    body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f1ec; color: #1c1c1e; }
    main { padding: 28px 32px 40px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 4px; }
    .sub { color: #6e6e73; margin: 0 0 22px; }
    h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #86868b; margin: 28px 0 12px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .cell { width: 160px; }
    .cell .pad { height: 120px; display: grid; place-items: center; border-radius: 16px; background: #fff; border: 1px solid #e5e2db; }
    .cell .pad.dark { background: #1d1d1f; border-color: #1d1d1f; color: #f5f5f7; }
    .cell svg { width: 72px; height: 72px; }
    .cell label { display: block; margin-top: 8px; font-weight: 600; font-size: 13px; }
    .cell span { color: #6e6e73; font-size: 12px; }
    .cmp .pad { height: 140px; overflow: hidden; }
    .cmp img { width: 100%; height: 140px; object-fit: contain; }
    .cmp svg { width: 72px; height: 72px; color: #1d1d1f; }
  </style>
</head>
<body>
  <main>
    <h1>Meerkat head — slim outline</h1>
    <p class="sub">Front-facing head and neck. Lucide-weight stroke. Minimal face.</p>
    <h2>Generated — light</h2>
    <div class="row" id="light"></div>
    <h2>Generated — dark / menu-bar</h2>
    <div class="row" id="dark"></div>
    <h2>Compared with real marks</h2>
    <div class="row cmp" id="cmp"></div>
  </main>
  <script>
    const files = [
      ["01-lookout.svg", "Lookout", "Open eyes. Pick."],
      ["02-scout.svg", "Scout", "Foreshortened snout"],
      ["03-sentinel.svg", "Sentinel", "Tighter head"],
      ["04-vigil.svg", "Vigil", "2015 crown tuft"],
      ["05-gaze.svg", "Gaze", "Lucide tick eyes"],
      ["06-menu.svg", "Menu", "1.75px for 18px"],
    ];
    async function svg(file) {
      const t = await fetch(file).then(r => r.text());
      return new DOMParser().parseFromString(t, "image/svg+xml").documentElement;
    }
    function cell(svgEl, name, note, dark) {
      const el = document.createElement("div");
      el.className = "cell";
      el.innerHTML = `<div class="pad${dark ? " dark" : ""}"></div><label>${name}</label><span>${note}</span>`;
      el.querySelector(".pad").append(svgEl);
      return el;
    }
    (async () => {
      for (const [file, name, note] of files) {
        const a = await svg(file);
        const b = a.cloneNode(true);
        document.getElementById("light").append(cell(a, name, note, false));
        document.getElementById("dark").append(cell(b, name, note, true));
      }
      const refs = [
        ["refs/cat.svg", "Lucide Cat", true],
        ["refs/dog.svg", "Lucide Dog", true],
        ["refs/eye.svg", "This app today", true],
        ["refs/meerkat-2015.webp", "Meerkat iOS 2015", false],
        ["refs/meerkat-brand.png", "Meerkat brand", false],
        ["refs/flaticon-meerkat.png", "Flaticon stock", false],
      ];
      for (const [file, name, isSvg] of refs) {
        const el = document.createElement("div");
        el.className = "cell";
        if (isSvg) {
          el.innerHTML = `<div class="pad"></div><label>${name}</label><span>Icon system</span>`;
          el.querySelector(".pad").append(await svg(file));
        } else {
          el.innerHTML = `<div class="pad"><img src="${file}" alt="${name}"></div><label>${name}</label><span>Real app / stock</span>`;
        }
        document.getElementById("cmp").append(el);
      }
    })();
  </script>
</body>
</html>

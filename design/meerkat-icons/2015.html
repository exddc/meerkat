<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2015 Meerkat → slim outline</title>
  <style>
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f1ea; color: #1d1d1f; }
    main { max-width: 980px; margin: 0 auto; padding: 32px; }
    h1 { font-size: 24px; letter-spacing: -0.03em; margin: 0 0 6px; }
    .sub { color: #6e6e73; margin: 0 0 28px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; border: 1px solid #e6e1d6; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #86868b; margin: 0 0 14px; }
    .stage { height: 280px; display: grid; place-items: center; }
    .stage img { width: 240px; height: 240px; object-fit: contain; border-radius: 54px; }
    .stage svg { width: 220px; height: 220px; color: #1d1d1f; }
    .dark { background: #1d1d1f; color: #f5f5f7; border-color: #1d1d1f; }
    .dark h2 { color: #a1a1a6; }
    .dark svg { color: #f5f5f7; }
    .sizes { display: flex; align-items: flex-end; gap: 18px; margin-top: 8px; }
    .sizes figure { margin: 0; text-align: center; }
    .sizes figcaption { font-size: 11px; color: #86868b; margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>2015 iOS icon, as a slim drawing</h1>
    <p class="sub">Same character: tuft, side-ears, long neck, oval eye patches with shallow lids. Fill removed, 1.0 stroke.</p>
    <div class="pair">
      <div class="card">
        <h2>Original — Meerkat iOS 2015</h2>
        <div class="stage"><img src="refs/meerkat-2015.webp" alt="Meerkat iOS 2015"></div>
      </div>
      <div class="card">
        <h2>Slim outline</h2>
        <div class="stage" id="big"></div>
      </div>
      <div class="card dark">
        <h2>Menu bar / dark</h2>
        <div class="stage" id="dark"></div>
      </div>
      <div class="card">
        <h2>16 / 24 / 32 / 48 / 72</h2>
        <div class="sizes" id="sizes"></div>
      </div>
    </div>
  </main>
  <script>
    fetch("../Meerkat/Assets.xcassets/MenuBarIcon.imageset/MenuBarIcon.svg").then(r => r.text()).then(t => {
      const svg = new DOMParser().parseFromString(t, "image/svg+xml").documentElement;
      document.getElementById("big").append(svg.cloneNode(true));
      document.getElementById("dark").append(svg.cloneNode(true));
      [16,24,32,48,72].forEach(n => {
        const fig = document.createElement("figure");
        const c = svg.cloneNode(true);
        c.style.width = c.style.height = n + "px";
        fig.innerHTML = `<figcaption>${n}px</figcaption>`;
        fig.prepend(c);
        document.getElementById("sizes").append(fig);
      });
    });
  </script>
</body>
</html>

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.0.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-appcast
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must match vX.Y.Z" >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "Release commit is not on main" >&2; exit 1; }
          VERSION="${TAG#v}"
          BUILD="$(git rev-list --count HEAD)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve signing identity
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Restore existing appcast
        run: |
          mkdir -p feed
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            git fetch origin gh-pages
            git show origin/gh-pages:appcast.xml > feed/appcast.xml
          elif [ "$result" -ne 2 ]; then
            echo "Could not check the existing appcast" >&2
            exit 1
          fi

      - name: Archive Meerkat
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          [ -n "$SPARKLE_PUBLIC_KEY" ] || { echo "SPARKLE_PUBLIC_KEY is empty" >&2; exit 1; }
          xcodebuild \
            -project Meerkat.xcodeproj \
            -scheme Meerkat \
            -configuration Release \
            -archivePath build/Meerkat.xcarchive \
            -clonedSourcePackagesDirPath .build \
            archive \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build }}" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          codesign --deep --strict --verify build/Meerkat.xcarchive/Products/Applications/Meerkat.app

      - name: Create and notarize DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/dmg
          ditto build/Meerkat.xcarchive/Products/Applications/Meerkat.app build/dmg/Meerkat.app
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname Meerkat \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/Meerkat-${{ steps.meta.outputs.version }}.dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "build/Meerkat-${{ steps.meta.outputs.version }}.dmg"
          xcrun notarytool submit \
            "build/Meerkat-${{ steps.meta.outputs.version }}.dmg" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "build/Meerkat-${{ steps.meta.outputs.version }}.dmg"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Meerkat ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: build/Meerkat-${{ steps.meta.outputs.version }}.dmg

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "SPARKLE_PRIVATE_KEY is empty" >&2; exit 1; }
          GENERATE_APPCAST="$(find .build -type f -name generate_appcast | head -n 1)"
          [ -x "$GENERATE_APPCAST" ] || { echo "generate_appcast not found" >&2; exit 1; }
          cp "build/Meerkat-${{ steps.meta.outputs.version }}.dmg" feed/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/" \
            --maximum-versions 0 \
            feed
          grep -Eq 'Meerkat-${{ steps.meta.outputs.version }}.dmg"[^>]*sparkle:edSignature' feed/appcast.xml

      - name: Publish appcast to GitHub Pages
        run: |
          mkdir -p public
          cp feed/appcast.xml public/appcast.xml

      - name: Deploy appcast
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
